<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tigerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tigerDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <filter id="tigerGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Tiger head -->
  <g filter="url(#tigerGlow)">
    <path d="M60 15 
             C35 15 20 35 20 55 
             C20 75 35 95 60 105 
             C85 95 100 75 100 55 
             C100 35 85 15 60 15Z" 
          fill="url(#tigerGold)" opacity="0.95"/>
    
    <!-- Stripes -->
    <path d="M40 30 L48 42 M80 30 L72 42 M35 50 L45 60 M85 50 L75 60 M38 68 L48 78 M82 68 L72 78" 
          stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Eyes -->
    <ellipse cx="45" cy="52" rx="5" ry="6" fill="#1a1a2e"/>
    <ellipse cx="75" cy="52" rx="5" ry="6" fill="#1a1a2e"/>
    <ellipse cx="46" cy="50" rx="2" ry="2.5" fill="#FFD700"/>
    <ellipse cx="76" cy="50" rx="2" ry="2.5" fill="#FFD700"/>
    
    <!-- Nose -->
    <path d="M57 68 L63 68 L60 75 Z" fill="#1a1a2e"/>
    
    <!-- Mouth -->
    <path d="M53 80 Q60 87 67 80" stroke="#1a1a2e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Crown -->
    <path d="M42 22 L46 12 L53 19 L60 8 L67 19 L74 12 L78 22" 
          stroke="#FFD700" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="60" cy="8" r="2.5" fill="#FFD700"/>
  </g>
</svg>
