<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIGERBET - Slot Real</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background: radial-gradient(circle at center, #300000 0%, #000000 100%);
    font-family: 'Arial', sans-serif;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .game-container {
    width: 400px;
    height: 600px;
    position: relative;
    background: linear-gradient(135deg, #1a0000 0%, #0a0000 100%);
    border: 4px solid #FFD700;
    border-radius: 20px;
    box-shadow: 0 0 50px rgba(255, 215, 0, 0.5);
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 15px;
    background: linear-gradient(135deg, #8B0000 0%, #4A0000 100%);
    border-bottom: 3px solid #FFD700;
    border-radius: 15px 15px 0 0;
  }
  .balance-display,
  .win-display {
    flex: 1;
    text-align: center;
  }
  .label {
    display: block;
    font-size: 11px;
    color: #FFD700;
    font-weight: bold;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
  }
  .value {
    display: block;
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
  }
  .win-display .value {
    color: #00FF00;
    text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
  }
  .reels-container {
    position: relative;
    height: 320px;
    padding: 20px;
    display: flex;
    justify-content: center;
    gap: 15px;
  }
  .reel {
    width: 100px;
    height: 280px;
    background: linear-gradient(180deg, #0a0000 0%, #1a0000 50%, #0a0000 100%);
    border: 3px solid #8B4513;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
  }
  .reel-strip {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    will-change: transform;
  }
  .symbol {
    width: 100%;
    height: 90px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 55px;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 165, 0, 0.5);
    filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
  }
  .symbol.winning {
    animation: symbol-glow 0.3s infinite alternate;
  }
  @keyframes symbol-glow {
    from {
      filter: brightness(1) drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
      transform: scale(1);
    }
    to {
      filter: brightness(1.5) drop-shadow(0 0 30px rgba(255, 215, 0, 0.8));
      transform: scale(1.15);
    }
  }
  .reel.spinning .symbol {
    filter: blur(2px);
  }
  .bottom-panel {
    padding: 15px;
    background: linear-gradient(135deg, #8B0000 0%, #4A0000 100%);
    border-top: 3px solid #FFD700;
    border-radius: 0 0 15px 15px;
  }
  .bet-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-bottom: 15px;
  }
  .bet-btn {
    width: 50px;
    height: 50px;
    background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
    border: 3px solid #FFD700;
    border-radius: 50%;
    font-size: 30px;
    font-weight: bold;
    color: #000;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 15px rgba(255, 215, 0, 0.5);
  }
  .bet-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 20px rgba(255, 215, 0, 0.7);
  }
  .bet-btn:active {
    transform: scale(0.95);
  }
  .bet-display {
    text-align: center;
    min-width: 100px;
  }
  .bet-label {
    display: block;
    font-size: 11px;
    color: #FFD700;
    font-weight: bold;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
  }
  .bet-value {
    display: block;
    font-size: 24px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
  }
  .spin-btn {
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, #FF0000 0%, #8B0000 100%);
    border: 4px solid #FFD700;
    border-radius: 15px;
    font-size: 32px;
    font-weight: bold;
    color: #fff;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
  }
  .spin-btn:hover:not(:disabled) {
    transform: scale(1.02);
    box-shadow: 0 0 40px rgba(255, 0, 0, 0.7);
  }
  .spin-btn:active:not(:disabled) {
    transform: scale(0.98);
  }
  .spin-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .spin-text {
    position: relative;
    z-index: 2;
  }
  .spin-glow {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(255, 0, 0, 0.5) 0%, rgba(139, 0, 0, 0.5) 100%);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .spin-btn.spinning .spin-glow {
    opacity: 1;
    animation: spin-pulse 0.5s infinite alternate;
  }
  @keyframes spin-pulse {
    from {
      opacity: 0.5;
    }
    to {
      opacity: 1;
    }
  }
  .win-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.9);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 100;
    border-radius: 15px;
  }
  .win-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .win-content {
    text-align: center;
    animation: win-pop 0.5s ease-out;
  }
  @keyframes win-pop {
    from {
      transform: scale(0);
    }
    to {
      transform: scale(1);
    }
  }
  .win-amount {
    font-size: 52px;
    font-weight: bold;
    color: #FFD700;
    text-shadow: 0 0 30px rgba(255, 215, 0, 0.8), 0 0 60px rgba(255, 165, 0, 0.5);
    margin-bottom: 15px;
  }
  .win-label {
    font-size: 36px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
  }
  #particles {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 50;
  }
  .game-container.shake {
    animation: shake 0.3s ease-in-out;
  }
  @keyframes shake {
    0%, 100% {
      transform: translateX(0);
    }
    25% {
      transform: translateX(-8px);
    }
    75% {
      transform: translateX(8px);
    }
  }
</style>
</head>
<body>

<div class="game-container">
  <div class="top-bar">
    <div class="balance-display">
      <span class="label">SALDO</span>
      <span class="value" id="balance">R$ 1000</span>
    </div>
    <div class="win-display">
      <span class="label">GANHO</span>
      <span class="value" id="win">R$ 0</span>
    </div>
  </div>

  <div class="reels-container">
    <div class="reel" id="reel-0">
      <div class="reel-strip"></div>
    </div>
    <div class="reel" id="reel-1">
      <div class="reel-strip"></div>
    </div>
    <div class="reel" id="reel-2">
      <div class="reel-strip"></div>
    </div>
  </div>

  <div class="bottom-panel">
    <div class="bet-controls">
      <button class="bet-btn" id="minus">-</button>
      <div class="bet-display">
        <span class="bet-label">APOSTA</span>
        <span class="bet-value" id="bet">R$ 10</span>
      </div>
      <button class="bet-btn" id="plus">+</button>
    </div>
    <button class="spin-btn" id="spin">
      <span class="spin-text">SPIN</span>
      <div class="spin-glow"></div>
    </button>
  </div>

  <div class="win-overlay" id="win-overlay">
    <div class="win-content">
      <div class="win-amount" id="win-amount">R$ 0</div>
      <div class="win-label">GANHOU!</div>
    </div>
  </div>

  <canvas id="particles"></canvas>
</div>

<script>
const SYMBOLS = ["🐯", "💰", "🍀", "💎", "7️⃣"];
const SYMBOL_HEIGHT = 90;
let balance = 1000;
let bet = 10;
let isSpinning = false;
let reels = [];

const balanceEl = document.getElementById('balance');
const winEl = document.getElementById('win');
const betEl = document.getElementById('bet');
const spinBtn = document.getElementById('spin');
const minusBtn = document.getElementById('minus');
const plusBtn = document.getElementById('plus');
const winOverlay = document.getElementById('win-overlay');
const winAmountEl = document.getElementById('win-amount');
const particlesCanvas = document.getElementById('particles');
const gameContainer = document.querySelector('.game-container');

function init() {
  for (let i = 0; i < 3; i++) {
    const reel = document.getElementById(`reel-${i}`);
    const strip = reel.querySelector('.reel-strip');
    reels.push({
      element: reel,
      strip: strip,
      position: 0,
      targetPosition: 0,
      speed: 0,
      isSpinning: false
    });
    fillReelWithSymbols(strip);
  }
  
  spinBtn.addEventListener('click', spin);
  minusBtn.addEventListener('click', decreaseBet);
  plusBtn.addEventListener('click', increaseBet);
  winOverlay.addEventListener('click', () => {
    winOverlay.classList.remove('active');
  });
  
  initParticles();
  updateDisplay();
  
  // Glow animation
  let glowIntensity = 0;
  const spinGlow = spinBtn.querySelector('.spin-glow');
  function animateGlow() {
    glowIntensity += 0.03;
    spinGlow.style.opacity = 0.3 + Math.sin(glowIntensity) * 0.2;
    requestAnimationFrame(animateGlow);
  }
  animateGlow();
}

function fillReelWithSymbols(strip) {
  strip.innerHTML = '';
  for (let i = 0; i < 30; i++) {
    const symbol = document.createElement('div');
    symbol.className = 'symbol';
    symbol.textContent = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
    strip.appendChild(symbol);
  }
}

function decreaseBet() {
  if (bet > 10 && !isSpinning) {
    bet -= 10;
    updateDisplay();
  }
}

function increaseBet() {
  if (bet < 100 && !isSpinning) {
    bet += 10;
    updateDisplay();
  }
}

function updateDisplay() {
  balanceEl.textContent = `R$ ${balance}`;
  winEl.textContent = `R$ ${0}`;
  betEl.textContent = `R$ ${bet}`;
}

function generateResults() {
  const results = [];
  for (let i = 0; i < 3; i++) {
    results.push(SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
  }
  return results;
}

function spin() {
  if (isSpinning || balance < bet) {
    if (balance < bet) {
      alert('Saldo insuficiente!');
    }
    return;
  }
  
  isSpinning = true;
  balance -= bet;
  updateDisplay();
  
  spinBtn.classList.add('spinning');
  spinBtn.disabled = true;
  minusBtn.disabled = true;
  plusBtn.disabled = true;
  spinBtn.querySelector('.spin-text').textContent = 'GIRANDO...';
  
  const finalResults = generateResults();
  
  reels.forEach((reel, index) => {
    startReelSpin(reel, index, finalResults[index]);
  });
}

function startReelSpin(reel, index, finalSymbol) {
  const strip = reel.strip;
  const extraSpins = 15 + index * 8;
  const targetPosition = (extraSpins * SYMBOLS.length * SYMBOL_HEIGHT);
  
  reel.isSpinning = true;
  reel.element.classList.add('spinning');
  reel.targetPosition = targetPosition;
  reel.speed = 0;
  reel.finalSymbol = finalSymbol;
  
  const startTime = performance.now();
  const duration = 2500 + (index * 400);
  
  function animate(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(elapsed / duration, 1);
    
    // Ease-out cubic
    const easeOut = 1 - Math.pow(1 - progress, 3);
    
    reel.position = easeOut * targetPosition;
    strip.style.transform = `translateY(-${reel.position}px)`;
    
    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      stopReelSpin(reel, index, finalSymbol);
    }
  }
  
  requestAnimationFrame(animate);
}

function stopReelSpin(reel, index, finalSymbol) {
  const strip = reel.strip;
  reel.isSpinning = false;
  reel.element.classList.remove('spinning');
  reel.position = 0;
  strip.style.transform = `translateY(0px)`;
  updateVisibleSymbols(reel, finalSymbol);
  
  if (reels.every(r => !r.isSpinning)) {
    checkWin();
  }
}

function updateVisibleSymbols(reel, finalSymbol) {
  const strip = reel.strip;
  strip.innerHTML = '';
  
  // 3 símbolos visíveis
  for (let i = 0; i < 3; i++) {
    const symbol = document.createElement('div');
    symbol.className = 'symbol';
    symbol.textContent = finalSymbol;
    strip.appendChild(symbol);
  }
}

function checkWin() {
  const visibleSymbols = reels.map(reel => {
    const symbols = reel.strip.querySelectorAll('.symbol');
    return symbols[1].textContent;
  });
  
  if (visibleSymbols[0] === visibleSymbols[1] && visibleSymbols[1] === visibleSymbols[2]) {
    const multipliers = {
      '🐯': 10,
      '💰': 5,
      '🍀': 3,
      '💎': 2,
      '7️⃣': 1
    };
    const multiplier = multipliers[visibleSymbols[0]] || 1;
    const win = bet * multiplier;
    balance += win;
    
    showWin(win);
    highlightWinningSymbols();
    triggerParticles();
    screenShake();
  }
  
  spinBtn.classList.remove('spinning');
  spinBtn.disabled = false;
  minusBtn.disabled = false;
  plusBtn.disabled = false;
  spinBtn.querySelector('.spin-text').textContent = 'SPIN';
  isSpinning = false;
  
  updateDisplay();
}

function showWin(amount) {
  winAmountEl.textContent = `R$ ${amount}`;
  winOverlay.classList.add('active');
}

function highlightWinningSymbols() {
  reels.forEach(reel => {
    const symbols = reel.strip.querySelectorAll('.symbol');
    symbols[1].classList.add('winning');
    setTimeout(() => symbols[1].classList.remove('winning'), 2000);
  });
}

function screenShake() {
  gameContainer.classList.add('shake');
  setTimeout(() => gameContainer.classList.remove('shake'), 300);
}

function initParticles() {
  particlesCanvas.width = 400;
  particlesCanvas.height = 600;
}

function triggerParticles() {
  const ctx = particlesCanvas.getContext('2d');
  const particles = [];
  
  for (let i = 0; i < 150; i++) {
    particles.push({
      x: 200,
      y: 300,
      vx: (Math.random() - 0.5) * 15,
      vy: (Math.random() - 0.5) * 15 - 8,
      size: Math.random() * 12 + 6,
      color: Math.random() > 0.5 ? '#FFD700' : '#FFA500',
      life: 1
    });
  }
  
  function animateParticles() {
    ctx.clearRect(0, 0, particlesCanvas.width, particlesCanvas.height);
    
    particles.forEach((p, index) => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.3;
      p.life -= 0.015;
      
      if (p.life > 0) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fill();
      } else {
        particles.splice(index, 1);
      }
    });
    
    if (particles.length > 0) {
      requestAnimationFrame(animateParticles);
    }
  }
  
  animateParticles();
}

init();
</script>
</body>
</html>
