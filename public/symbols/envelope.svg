<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="enBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A5A"/>
      <stop offset="50%" stop-color="#E11919"/>
      <stop offset="100%" stop-color="#9E0505"/>
    </linearGradient>
    <linearGradient id="enFlap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7070"/>
      <stop offset="100%" stop-color="#C21010"/>
    </linearGradient>
    <linearGradient id="enGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A8"/>
      <stop offset="50%" stop-color="#FFD23F"/>
      <stop offset="100%" stop-color="#C88A00"/>
    </linearGradient>
    <filter id="enDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3a0000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g filter="url(#enDrop)">
    <!-- envelope body -->
    <rect x="24" y="26" width="72" height="72" rx="9" fill="url(#enBody)" stroke="#7a0303" stroke-width="2"/>
    <!-- side sheen -->
    <rect x="30" y="32" width="10" height="60" rx="5" fill="#ffffff" opacity="0.12"/>
    <!-- top flap -->
    <path d="M24 35 C24 30 28 26 33 26 L87 26 C92 26 96 30 96 35 L96 44 C82 56 38 56 24 44Z" fill="url(#enFlap)" stroke="#7a0303" stroke-width="1.5"/>
    <!-- gold medallion -->
    <circle cx="60" cy="60" r="18" fill="url(#enGold)" stroke="#9a6a00" stroke-width="2"/>
    <circle cx="60" cy="60" r="18" fill="none" stroke="#fff3c0" stroke-width="1" opacity="0.7"/>
    <!-- fu character 福 stylized -->
    <text x="60" y="69" font-family="'SimHei','Microsoft YaHei',sans-serif" font-size="22" font-weight="900" text-anchor="middle" fill="#9a1010">福</text>
    <!-- tassel -->
    <rect x="57" y="96" width="6" height="10" rx="3" fill="url(#enGold)"/>
    <path d="M60 106 L56 116 M60 106 L60 117 M60 106 L64 116" stroke="#FFD23F" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
