<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient circle -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" stroke="url(#goldGradient)" stroke-width="4" fill="none" opacity="0.8"/>
  
  <!-- Inner circle background -->
  <circle cx="100" cy="100" r="85" fill="url(#darkGradient)"/>
  
  <!-- Tiger silhouette - stylized premium design -->
  <g filter="url(#glow)">
    <!-- Tiger head outline -->
    <path d="M100 25 
             C60 25 35 55 35 90 
             C35 125 55 155 100 175 
             C145 155 165 125 165 90 
             C165 55 140 25 100 25Z" 
          fill="url(#goldGradient)" opacity="0.9"/>
    
    <!-- Tiger stripes -->
    <path d="M70 50 L80 70 M130 50 L120 70 M60 80 L75 95 M140 80 L125 95 M65 110 L80 125 M135 110 L120 125" 
          stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Tiger eyes -->
    <ellipse cx="75" cy="85" rx="8" ry="10" fill="#1a1a2e"/>
    <ellipse cx="125" cy="85" rx="8" ry="10" fill="#1a1a2e"/>
    <ellipse cx="77" cy="83" rx="3" ry="4" fill="#FFD700"/>
    <ellipse cx="127" cy="83" rx="3" ry="4" fill="#FFD700"/>
    
    <!-- Tiger nose -->
    <path d="M95 110 L105 110 L100 120 Z" fill="#1a1a2e"/>
    
    <!-- Tiger mouth -->
    <path d="M90 125 Q100 135 110 125" stroke="#1a1a2e" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Crown on top -->
    <path d="M70 35 L75 20 L85 30 L100 15 L115 30 L125 20 L130 35" 
          stroke="#FFD700" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="100" cy="15" r="4" fill="#FFD700"/>
  </g>
  
  <!-- Text "TIGER" at bottom -->
  <text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#FFD700" letter-spacing="3">TIGER</text>
</svg>
